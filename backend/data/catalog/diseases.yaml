# ROOTSHIFT disease catalog — Kansas pilot
# Cardinal temperatures and wetness requirements are [P] starting values,
# pending agronomist validation (D11). Never used to prescribe products or rates.
version: "2.0.0"

diseases:
  - id: gray_leaf_spot_corn
    name_en: Gray leaf spot
    pathogen: Cercospora zeae-maydis
    crops: [corn]
    cardinal_temp: { min: 15, opt_lo: 22, opt_hi: 30, max: 35 }
    wetness_hours_required: 12
    susceptible_stages: [v8, tasseling, silking]
    inoculum_sources: [crop_residue]
    severity_weight: 0.8
    confidence: preliminary
    actions:
      cultural:
        - "Rotate to a non-host crop for at least 2 seasons"
        - "Bury or remove residue"
        - "Choose a hybrid with better resistance"
      monitoring:
        - "Scout from V8 onward if rainfall exceeds 10 mm"
      chemical:
        - "Follow the label and consult an agronomist; no rates are prescribed"

  - id: northern_corn_leaf_blight
    name_en: Northern corn leaf blight
    pathogen: Exserohilum turcicum
    crops: [corn]
    cardinal_temp: { min: 10, opt_lo: 18, opt_hi: 27, max: 32 }
    wetness_hours_required: 8
    susceptible_stages: [v8, tasseling]
    inoculum_sources: [crop_residue]
    severity_weight: 0.7
    confidence: preliminary
    actions:
      cultural:
        - "Rotate out of corn for at least 1 season"
        - "Manage residue"
      monitoring:
        - "Scout after cool, wet periods"
      chemical:
        - "Follow the label and consult an agronomist"

