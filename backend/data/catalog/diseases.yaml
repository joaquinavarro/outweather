      cultural:
        - "Rotate and manage residue"
        - "Avoid highly susceptible hybrids in high-risk fields"
      monitoring:
        - "Scout from V10 in cool, humid seasons"
      chemical:
        - "Follow the label and consult an agronomist"

  - id: sudden_death_syndrome
    name_en: Sudden death syndrome
    pathogen: Fusarium virguliforme
