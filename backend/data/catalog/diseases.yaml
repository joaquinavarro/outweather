    confidence: preliminary
    actions:
      cultural:
        - "Improve drainage and avoid early planting in wet soils"
        - "Rotate with a non-host"
      monitoring:
        - "Watch for foliar symptoms after wet periods"
      chemical:
        - "Follow the label and consult an agronomist"

  - id: white_mold_soybean
    name_en: White mold
    pathogen: Sclerotinia sclerotiorum
