    inoculum_sources: [soil, crop_residue]
    severity_weight: 0.8
    confidence: preliminary
    actions:
      cultural:
        - "Widen row spacing and reduce plant density in high-risk fields"
        - "Rotate with a non-host"
      monitoring:
        - "Scout during flowering after prolonged wetness"
      chemical:
        - "Follow the label and consult an agronomist"

